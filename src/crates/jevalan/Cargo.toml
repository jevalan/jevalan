[package]
name = "jevalan"
version = "0.1.0-alpha.1"
description = "Hub local de decisiones: pregunta antes de actuar y recibe una respuesta tipada"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jevalan/jevalan"
homepage = "https://jevalan.com"
edition.workspace = true
rust-version.workspace = true

[dependencies]
jevalan-daemon = { path = "../jevalan-daemon", version = "0.1.0" }
jevalan-edit = { path = "../jevalan-edit", version = "0.1.0" }
jevalan-tui = { path = "../jevalan-tui", version = "0.1.0" }
jevalan-lab = { path = "../jevalan-lab", version = "0.1.0" }
jevalan-hub = { path = "../jevalan-hub", version = "0.1.0" }
clap = { version = "4", features = ["derive", "env"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
