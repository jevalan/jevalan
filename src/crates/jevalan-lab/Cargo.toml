[package]
name = "jevalan-lab"
version = "0.1.0"
description = "Laboratorio de fixtures: regresion offline y medida en vivo"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jevalan/jevalan"
homepage = "https://jevalan.com"
edition.workspace = true
rust-version.workspace = true

[dependencies]
jevalan-daemon = { path = "../jevalan-daemon", version = "0.1.0" }
jevalan-flow = { path = "../jevalan-flow", version = "0.1.0" }
jevalan-hub = { path = "../jevalan-hub", version = "0.1.0" }
# Las reglas fijas del flujo local se comprueban con la misma expresión regular que el flujo declara.
regex = "1"
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
