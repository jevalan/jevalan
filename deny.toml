# Política de dependencias de jevalan. Se comprueba con `cargo deny check`.

[graph]
all-features = true

[licenses]
# Solo licencias permisivas. Nada de copyleft fuerte (GPL, AGPL) en el árbol.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Unlicense",
]
confidence-threshold = 0.9

[advisories]
# Aviso de mantenimiento, no una vulnerabilidad. Llega por el analizador de YAML;
# pendiente de migrar a una alternativa mantenida.
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml sin mantenimiento; sin vulnerabilidad conocida" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
