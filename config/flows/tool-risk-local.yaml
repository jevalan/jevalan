# tool.risk servido en local (Kev o Laya), sin que nada salga de la máquina.
# Réplica sobria de Toolgate: reglas fijas, cuatro preguntas de riesgo y los umbrales 0.55 → ask, 0.85 → deny.
# Las cuatro preguntas viajan en UNA sola llamada (nodo `batch`): antes eran hasta cuatro llamadas encadenadas,
# que se cortaban en el primer riesgo ≥ 0.55. Se enruta con las reglas `route`, que ven las respuestas crudas.
# Las reglas fijas y las cuatro preguntas viven en `config/signals/`, el catálogo que cualquier flujo puede reutilizar.
description: "Riesgo de una llamada a herramienta, decidido en local"
defaults: { backend: kev, model: "kev-latest" }
start: rm_root
nodes:
  rm_root:
    type: rule
    when: 'signals.rm_root'
    out: { "true": deny_static, "false": pipe_sh }
  pipe_sh:
    type: rule
    when: 'signals.pipe_sh'
    out: { "true": ask_static, "false": risks }
  risks:
    type: batch
    signals: [destructive, exfiltration, privilege, secret_exposure]
    route:
      # Gana la primera que sea verdadera; las respuestas viven en `answers.risks.<pregunta>`.
      - when: 'answers.risks.exists(k, answers.risks[k] >= 0.85)'
        to: deny
      - when: 'answers.risks.exists(k, answers.risks[k] >= 0.55)'
        to: ask
    else: allow
    out: { error: ask_error }
outputs:
  deny_static:  { outcome: ok, data: { verdict: deny, source: static-rule, reason: "regla fija: borrado recursivo de la raíz o del hogar" } }
  ask_static:   { outcome: ok, data: { verdict: ask,  source: static-rule, reason: "regla fija: descarga canalizada a un intérprete" } }
  deny:         { outcome: ok, data: { verdict: deny, source: model, reason: "algún riesgo ≥ 0.85", probabilities: "$answer/risks" } }
  ask:          { outcome: ok, data: { verdict: ask,  source: model, reason: "algún riesgo ≥ 0.55", probabilities: "$answer/risks" } }
  allow:        { outcome: ok, data: { verdict: allow, source: model, reason: "todos los riesgos < 0.55", probabilities: "$answer/risks" } }
  ask_error:    { outcome: ok, data: { verdict: ask, source: fail-mode, reason: "el modelo local no respondió" } }
