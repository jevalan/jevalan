manifest_version: "2"
# La sirve un flujo del propio hub, asi que no es publicable y su publicador es
# local: declarar el repo de otro proyecto seria mentir sobre quien la mantiene.
namespace: local.jev
requires:
  runtime: none
  platform: any
version: "1"
description: "¿Merece la pena despertar a un agente dormido? (Wakegate como flujo)"
input_schema: { $file: "schemas/agent.wakeup.input.json" }
decision_schema: { $file: "schemas/agent.wakeup.decision.json" }
provider: { id: jevalan-flow, flow: agent-wakeup }
defaults: { deadline_ms: 3000 }
