# The local config, plus the remote OpenRouter backend.
#
# It is `config.local.yaml` with one extra backend: the local ones stay (`kev` is the one that
# decides `tool-risk-local`, i.e. the one serving your plugin) and OpenRouter is added with its key,
# which is what `config/flows/agent-wakeup.yaml` needs to stop loading as invalid.
#
# The key is read from the `.env` of the directory the daemon is launched from (`OPENROUTER_API_KEY`),
# never from this file: only its NAME goes here. If the variable is missing or empty, the daemon
# refuses to start, on purpose.
#
# jevalan serve --config config/lab/config.mixto.yaml
#
# Nothing else leaves the machine: `default_backend` is still `kev`, so any decision that names no
# backend stays local; only the flow that declares `openrouter` (agent-wakeup) goes out.
server: { addr: "127.0.0.1:8080", token_env: JEVALAN_TOKEN }
backends:
  kev:        { url: "http://127.0.0.1:8009", timeout_ms: 5000 }
  laya:       { url: "http://127.0.0.1:8021", timeout_ms: 5000 }
  openrouter: { url: "https://openrouter.ai", path: "/api/alpha/decisions", api_key_env: OPENROUTER_API_KEY, timeout_ms: 8000 }
default_backend: kev
flows_dir: ./config/flows
hub:
  capabilities_dir: ./config/capabilities-local
  allow_exec: false
