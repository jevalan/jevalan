[workspace]
resolver = "3"
members = ["src/crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
jevalan-events = { path = "src/crates/jevalan-events", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
# El disco anda escaso: basta con las líneas para los backtraces.
debug = "line-tables-only"

# El analizador CEL (ANTLR) gasta mucha pila sin optimizar y el hilo principal de Windows solo tiene 1 MB.
[profile.dev.package.cel]
opt-level = 2

[profile.dev.package.antlr4rust]
opt-level = 2
