# Actualizaciones de versiones: una solicitud semanal por ecosistema, agrupadas para no inundar el repositorio.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # This action's tag IS the Rust version: it is pinned by hand (MSRV), never auto-bumped.
      - dependency-name: "dtolnay/rust-toolchain"
  - package-ecosystem: npm
    directory: /docs/site
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      site-minor-and-patch:
        update-types: [minor, patch]
