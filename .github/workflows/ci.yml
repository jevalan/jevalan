name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast --locked
      - run: cargo run -p jevalan -- lab check
      - run: cargo run -p jevalan -- lab offline

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - name: THIRD_PARTY_LICENSES.txt is up to date
        run: |
          cargo about generate about.hbs -o "$RUNNER_TEMP/licenses.txt"
          if ! diff <(tr -d '\r' < THIRD_PARTY_LICENSES.txt) <(tr -d '\r' < "$RUNNER_TEMP/licenses.txt"); then
            echo "::error::THIRD_PARTY_LICENSES.txt is stale: run 'cargo about generate about.hbs -o THIRD_PARTY_LICENSES.txt'"
            exit 1
          fi
